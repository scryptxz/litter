<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" th:href="@{/css/index.css}" />
    <title>Cadastrar</title>
  </head>
  <body>
    <main class="auth-main">
      <form
        class="auth-form"
        th:action="@{/signup}"
        method="post"
        enctype="multipart/form-data"
        th:object="${user}"
        autocomplete="off"
      >
        <img th:src="@{img/litter-logo.png}" id="litter-logo" />


        <input
          id="picture"
          name="picture"
          type="file"
          accept="image/*"
          hidden
        />

        <input
          type="text"
          th:field="*{username}"
          placeholder="Nome do pet (Ex. Trovão)"
        />
        <input
          type="text"
          th:field="*{handle}"
          placeholder="Username (Ex. trovinho)"
        />
        <input type="password" th:field="*{password}" placeholder="Senha" />

        <label for="picture" class="profile-picture">
          <img id="preview" src="/img/default-icon.png" alt="Profile Picture" />
        </label>

        <button>Cadastrar</button>
        <p>
          Já possui uma conta?
          <a th:href="@{/login}" id="link-cadastro">Entre aqui.</a>
        </p>
      </form>
    </main>
  </body>
  <script th:src="@{/js/index.js}"></script>
</html>
